<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff &amp; Authority Login — LifeLine</title>
  <meta name="description" content="Authorized warden, operations staff, and executive authority authentication for LifeLine campus operations console.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a class="brand" href="index.html">
        <span class="brand__pulse" aria-hidden="true"></span>
        LifeLine <span class="brand__sub">Campus AIOps</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="login.html">Student Login</a>
        <a href="register.html">Register</a>
        <a href="admin-login.html" aria-current="page">Staff &amp; Authority</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="auth-shell">
      <div class="auth-card">
        
        <div class="auth-card__header">
          <div class="auth-card__logo" aria-hidden="true">🛡️</div>
          <h1 class="auth-card__title">Operations Console</h1>
          <p class="auth-card__subtitle">
            Sign in to manage incident triage, telemetry, and governance approvals.
          </p>
        </div>

        <form id="login-form" class="auth-form" novalidate data-redirect="admin.html">
          <div class="field">
            <label for="email">Staff / Authority Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="official@campus.edu" required autofocus>
            <span class="field-error" id="err-email" role="alert"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" id="btn-toggle-password" aria-label="Toggle password visibility">
                👁️
              </button>
            </div>
            <span class="field-error" id="err-password" role="alert"></span>
          </div>

          <div class="form-row-space">
            <label>
              <input type="checkbox" id="remember-me" name="remember">
              <span>Remember this workstation</span>
            </label>
            <a href="#" onclick="showToast('Contact campus security administrator to reset operations credentials.', 'info'); return false;">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--block" id="login-btn" style="margin-top:0.25rem;">
            Authenticate &amp; Access Console
          </button>

          <!-- 1-Click Quick Department Demo Logins -->
          <div style="margin-top:1.25rem; padding:0.85rem; background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-sm);">
            <span style="font-size:0.75rem; text-transform:uppercase; font-weight:700; color:var(--text-muted); display:block; margin-bottom:0.5rem;">
              ⚡ Quick 1-Click Department Logins:
            </span>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.45rem;">
              <button type="button" class="btn btn--ghost btn--sm" style="text-align:left; justify-content:flex-start; font-size:0.78rem; padding:0.35rem 0.5rem;" onclick="document.getElementById('email').value='it@lifeline.campus'; document.getElementById('password').value='it123'; document.getElementById('login-form').requestSubmit();">
                💻 <strong>IT Team</strong>
              </button>
              <button type="button" class="btn btn--ghost btn--sm" style="text-align:left; justify-content:flex-start; font-size:0.78rem; padding:0.35rem 0.5rem;" onclick="document.getElementById('email').value='hostel@lifeline.campus'; document.getElementById('password').value='hostel123'; document.getElementById('login-form').requestSubmit();">
                🏢 <strong>Hostel Warden</strong>
              </button>
              <button type="button" class="btn btn--ghost btn--sm" style="text-align:left; justify-content:flex-start; font-size:0.78rem; padding:0.35rem 0.5rem;" onclick="document.getElementById('email').value='mess@lifeline.campus'; document.getElementById('password').value='mess123'; document.getElementById('login-form').requestSubmit();">
                🍽️ <strong>Food Safety</strong>
              </button>
              <button type="button" class="btn btn--ghost btn--sm" style="text-align:left; justify-content:flex-start; font-size:0.78rem; padding:0.35rem 0.5rem;" onclick="document.getElementById('email').value='authority@lifeline.campus'; document.getElementById('password').value='authority123'; document.getElementById('login-form').requestSubmit();">
                👑 <strong>Campus Admin</strong>
              </button>
            </div>
          </div>
        </form>

        <div class="auth-card__foot">
          <p style="margin:0;"><a href="login.html">← Return to Student Portal</a></p>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">LifeLine by Cognora — Campus Operations Platform.</div>
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
