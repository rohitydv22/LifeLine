# ============================================================================
# LifeLine AIOps — Campus Wi-Fi / INET Framework Simulation Configuration
# OMNeT++ 6.0 / INET 4.5
# ============================================================================

[General]
network = lifeline.simulation.omnetpp.CampusNetwork
sim-time-limit = 300s
cpu-time-limit = 60s
total-stack = 64MiB
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s

# ----------------------------------------------------------------------------
# IPv4 Network Addressing & Routing Configuration
# ----------------------------------------------------------------------------
**.campusRouter.hasIpv4 = true
**.campusRouter.ipv4.ipForward = true
**.hostelSwitch.hasStp = true

# IP Subnets
# Campus Backbone: 10.0.0.0/24
# Hostel A Subnet: 10.10.3.0/24 (VLAN 30)
# Internet Server: 8.8.8.8

# ----------------------------------------------------------------------------
# 802.11ac Wireless & Physical Layer Settings
# ----------------------------------------------------------------------------
**.wlan[*].typename = "Ieee80211Interface"
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 5GHz
**.wlan[*].radio.bandwidth = 80MHz
**.wlan[*].radio.transmitter.power = 20mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].mac.typename = "Ieee80211Mac"
**.wlan[*].mac.dcf.channelAccess.cwMin = 15

# Access Point BSSID and SSID configuration
**.ap306.wlan[*].mgmt.ssid = "LifeLine-HostelA-FastWifi"
**.ap306.wlan[*].mac.address = "00:1A:2B:3C:4D:06"
**.ap307.wlan[*].mgmt.ssid = "LifeLine-HostelA-FastWifi"
**.ap307.wlan[*].mac.address = "00:1A:2B:3C:4D:07"
**.ap308.wlan[*].mgmt.ssid = "LifeLine-HostelA-FastWifi"
**.ap308.wlan[*].mac.address = "00:1A:2B:3C:4D:08"

# ----------------------------------------------------------------------------
# Synthetic Ping Applications (Health Probes)
# ----------------------------------------------------------------------------
**.student306_*.numApps = 1
**.student306_*.app[0].typename = "PingApp"
**.student306_*.app[0].destAddr = "8.8.8.8"
**.student306_*.app[0].sendInterval = 1s
**.student306_*.app[0].packetSize = 64B
**.student306_*.app[0].startTime = uniform(0.1s, 0.5s)

**.student307_*.numApps = 1
**.student307_*.app[0].typename = "PingApp"
**.student307_*.app[0].destAddr = "8.8.8.8"
**.student307_*.app[0].sendInterval = 1s

**.student308_*.numApps = 1
**.student308_*.app[0].typename = "PingApp"
**.student308_*.app[0].destAddr = "8.8.8.8"
**.student308_*.app[0].sendInterval = 1s

# ============================================================================
# RUN CONFIGURATION 1: Normal Steady-State Operations
# ============================================================================
[Config NormalCampusScenario]
description = "All Access Points, Hostel Switch, and Core Router Operational"
**.faultAP306 = false
**.faultHostelSwitch = false
**.faultCampusRouter = false
**.packetLossRate = 0.0

# ============================================================================
# RUN CONFIGURATION 2: Fault Scenario A — Single AP Failure (AP-306)
# ============================================================================
[Config SingleAPFailure_AP306]
description = "Room 306 AP-306 crashes; nearby AP-307 & AP-308 remain healthy"
**.faultAP306 = true
**.ap306.hasStatus = true
**.ap306.status.initialStatus = "down"

# ============================================================================
# RUN CONFIGURATION 3: Fault Scenario B — Hostel Switch Outage (SW-HostelA)
# ============================================================================
[Config HostelSwitchFailure]
description = "Hostel Distribution Switch SW-HostelA fails; all hostel APs lose uplink"
**.faultHostelSwitch = true
**.hostelSwitch.hasStatus = true
**.hostelSwitch.status.initialStatus = "down"

# ============================================================================
# RUN CONFIGURATION 4: Fault Scenario C — Campus Core Router Failure
# ============================================================================
[Config CampusRouterFailure]
description = "Campus Gateway Router-CampusCore goes offline; campus-wide loss"
**.faultCampusRouter = true
**.campusRouter.hasStatus = true
**.campusRouter.status.initialStatus = "down"
